media: media
content:
  - name: pages
    label: Pages
    type: collection
    path: ""
    extension: html
    format: raw                  # Keep raw since your HTML files have no front matter
    exclude: [README.md, LICENSE, .pages.yml]
    view:
      fields: [name]             # Change this to [name] to show the filename in the sidebar
    fields:
      - name: body
        label: Page Content
        type: rich-text
