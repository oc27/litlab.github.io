media: media
content:
  - name: pages
    label: Pages
    type: collection
    path: ""
    extension: html
    format: yaml-frontmatter   # 1. Changed from 'raw' to save titles properly
    exclude: [README.md, LICENSE, .pages.yml]
    view:
      fields: [title]          # 2. Correct syntax to show the title in the sidebar list
    fields:
      - name: title
        label: Page Title
        type: string
        required: true
      - name: body
        label: Page Content
        type: rich-text
