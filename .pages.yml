media: media
content:
  - name: pages
    label: Pages
    type: collection
    path: /                     # Tells Pages CMS to explicitly read the absolute root folder
    extension: html
    format: code
    exclude: [README.md, LICENSE, .pages.yml]
    identifier: name            # Explicitly tells the CMS to index files by their filename
    fields:
      - name: body
        label: Page Content
        type: code
        options:
          mode: html
