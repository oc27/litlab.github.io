media: media
content:
  - name: pages
    label: Pages
    type: collection
    path: ""
    extension: html
    format: raw
    exclude: [README.md, LICENSE, .pages.yml]
    view:
      primary: "{name}"          # Sets the sidebar collection title text
      label: "{name}"            # Explicitly maps the page filename to the main editor header
    fields:
      - name: body
        label: Page Content
        type: rich-text
        key: ""
